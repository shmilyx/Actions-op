name: Build OpenWrt 24.10.2 with Custom Kernel and Config

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 安装依赖
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget subversion python3 python3-pip ccache upx-ucl

    # 下载 OpenWrt 24.10.2 源码
    - name: Download OpenWrt source
      run: |
        git clone --depth 1 -b v24.10.2 https://git.openwrt.org/openwrt/openwrt.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # 更换内核到 6.12.42 并指定 commit hash
    - name: Patch kernel to 6.12.42 with specific hash
      run: |
        cd openwrt
        # 设置内核版本
        sed -i 's/KERNEL_PATCHVER:=.*/KERNEL_PATCHVER:=6.12/' target/linux/generic/config-*
        echo "KERNEL_TESTING_PATCHVER:=6.12" >> target/linux/generic/config-*
        echo "KERNEL_GIT_HASH:=4804528a29cd20309a0b41c30e5aeffc35fa21ee3358f4a706d4586d003bc1fb" >> target/linux/generic/config-*
        # 更新内核源码
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # 配置软件源
    - name: Configure custom feeds
      run: |
        cd openwrt
        # 清空默认 feeds.conf.default，添加自定义软件源
        : > feeds.conf.default
        cat << EOF >> feeds.conf.default
        src/gz openwrt_base https://mirrors.aliyun.com/openwrt/releases/24.10.2/packages/x86_64/base
        src/gz openwrt_luci https://mirrors.aliyun.com/openwrt/releases/24.10.2/packages/x86_64/luci
        src/gz openwrt_packages https://mirrors.aliyun.com/openwrt/releases/24.10.2/packages/x86_64/packages
        src/gz openwrt_routing https://mirrors.aliyun.com/openwrt/releases/24.10.2/packages/x86_64/routing
        src/gz openwrt_telephony https://mirrors.aliyun.com/openwrt/releases/24.10.2/packages/x86_64/telephony
        src/gz openwrt_extras https://opkg.cooluc.com/openwrt-24.10/x86_64
        src/gz openwrt_core https://core.cooluc.com/x86_64/6.12.41~3ce64a03a98c671d5f39ca2f49939ab2-r1
        src-git wechatpush https://github.com/tty228/luci-app-wechatpush.git
        src-git helloworld https://github.com/sbwml/openwrt_helloworld.git -b v5
        EOF
        ./scripts/feeds update -a
        ./scripts/feeds install -a -p wechatpush
        ./scripts/feeds install -a -p helloworld
        ./scripts/feeds install -a

    # 应用自定义补丁和软件包
    - name: Apply custom packages and patches
      run: |
        cd openwrt
        # golang 1.25
        rm -rf feeds/packages/lang/golang
        git clone https://github.com/sbwml/packages_lang_golang -b 25.x feeds/packages/lang/golang

        # node - prebuilt
        rm -rf feeds/packages/lang/node
        git clone https://github.com/sbwml/feeds_packages_lang_node-prebuilt -b packages-24.10 feeds/packages/lang/node

        # default settings
        git clone https://github.com/sbwml/default-settings -b openwrt-24.10 package/new/default-settings

        # wwan
        git clone https://github.com/sbwml/wwan-packages package/new/wwan --depth=1

        # pcre - 8.45
        mkdir -p package/libs/pcre
        curl -s https://mirror.cooluc.com/openwrt/patch/pcre/Makefile > package/libs/pcre/Makefile
        curl -s https://mirror.cooluc.com/openwrt/patch/pcre/Config.in > package/libs/pcre/Config.in

        # lrzsz - 0.12.20
        rm -rf feeds/packages/utils/lrzsz
        git clone https://github.com/sbwml/packages_utils_lrzsz package/new/lrzsz

        # ddns - fix boot
        sed -i '/boot()/,+2d' feeds/packages/net/ddns-scripts/files/etc/init.d/ddns

        # nlbwmon - disable syslog
        sed -i 's/stderr 1/stderr 0/g' feeds/packages/net/nlbwmon/files/nlbwmon.init

        # irqbalance: disable build with numa
        curl -s https://mirror.cooluc.com/openwrt/patch/irqbalance/011-meson-numa.patch > feeds/packages/utils/irqbalance/patches/011-meson-numa.patch
        sed -i '/-Dcapng=disabled/i\\t-Dnuma=disabled \\' feeds/packages/utils/irqbalance/Makefile

        # frpc
        sed -i 's/procd_set_param stdout $stdout/procd_set_param stdout 0/g' feeds/packages/net/frp/files/frpc.init
        sed -i 's/procd_set_param stderr $stderr/procd_set_param stderr 0/g' feeds/packages/net/frp/files/frpc.init
        sed -i 's/stdout stderr //g' feeds/packages/net/frp/files/frpc.init
        sed -i '/stdout:bool/d;/stderr:bool/d' feeds/packages/net/frp/files/frpc.init
        sed -i '/stdout/d;/stderr/d' feeds/packages/net/frp/files/frpc.config
        sed -i 's/env conf_inc/env conf_inc enable/g' feeds/packages/net/frp/files/frpc.init
        sed -i "s/'conf_inc:list(string)'/& \\\\/" feeds/packages/net/frp/files/frpc.init
        sed -i "/conf_inc:list/a\\\t\t\'enable:bool:0\'" feeds/packages/net/frp/files/frpc.init
        sed -i '/procd_open_instance/i\\t\[ "$enable" -ne 1 \] \&\& return 1\n' feeds/packages/net/frp/files/frpc.init
        curl -s https://mirror.cooluc.com/openwrt/patch/luci/applications/luci-app-frpc/001-luci-app-frpc-hide-token.patch | patch -p1
        curl -s https://mirror.cooluc.com/openwrt/patch/luci/applications/luci-app-frpc/002-luci-app-frpc-add-enable-flag.patch | patch -p1

        # natmap
        sed -i 's/log_stdout:bool:1/log_stdout:bool:0/g;s/log_stderr:bool:1/log_stderr:bool:0/g' feeds/packages/net/natmap/files/natmap.init
        pushd feeds/luci
            curl -s https://mirror.cooluc.com/openwrt/patch/luci/applications/luci-app-natmap/0001-luci-app-natmap-add-default-STUN-server-lists.patch | patch -p1
        popd

        # luci-compat - fix translation
        sed -i 's/<%:Up%>/<%:Move up%>/g' feeds/luci/modules/luci-compat/luasrc/view/cbi/tblsection.htm
        sed -i 's/<%:Down%>/<%:Move down%>/g' feeds/luci/modules/luci-compat/luasrc/view/cbi/tblsection.htm

        # frpc translation
        sed -i 's,发送,Transmission,g' feeds/luci/applications/luci-app-transmission/po/zh_Hans/transmission.po
        sed -i 's,frp 服务器,Frp 服务器,g' feeds/luci/applications/luci-app-frps/po/zh_Hans/frps.po
        sed -i 's,frp 客户端,Frp 客户端,g' feeds/luci/applications/luci-app-frpc/po/zh_Hans/frpc.po

    # 生成 .config 文件
    - name: Generate .config file
      run: |
        cd openwrt
        # 设置目标架构和基本配置
        cat << EOF > .config
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        CONFIG_GRUB_TIMEOUT="3"
        CONFIG_ALL_KMODS=y
        CONFIG_ALL_NONSHARED=y
        CONFIG_KERNEL_BUILD_DOMAIN="cooluc.com"
        CONFIG_KERNEL_BUILD_USER="admin"
        CONFIG_KERNEL_MEMCG_V1=y
        CONFIG_KERNEL_MPTCP=y
        CONFIG_KERNEL_MPTCP_IPV6=y
        # CONFIG_KERNEL_PREEMPT_RT is not set
        CONFIG_PACKAGE_autocore-x86=y
        CONFIG_PACKAGE_bind-host=y
        CONFIG_PACKAGE_block-mount=y
        CONFIG_PACKAGE_coremark=y
        CONFIG_PACKAGE_default-settings=y
        CONFIG_TARGET_KERNEL_PARTSIZE=32
        CONFIG_TARGET_ROOTFS_PARTSIZE=944
        # CONFIG_KERNEL_KALLSYMS is not set

        # 管理 IP
        CONFIG_LAN_IPADDR="192.168.2.2"
        CONFIG_LAN_NETMASK="255.255.255.0"

        # 第三方软件包
        CONFIG_PACKAGE_nikki=m
        CONFIG_PACKAGE_luci-app-nikki=m
        CONFIG_PACKAGE_luci-app-nikki-zh-cn=m
        CONFIG_PACKAGE_luci-app-cloudflared=m
        CONFIG_PACKAGE_luci-appcloudflared-zh-cn=m
        CONFIG_PACKAGE_cloudflared=m
        CONFIG_PACKAGE_luci-app-wechatpush=m
        CONFIG_PACKAGE_luci-app-wechatpush-zh-cn=m
        CONFIG_PACKAGE_luci-app-passwall=m
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=y
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria is not set
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Server is not set
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_tuic_client is not set
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_GO is not set
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus is not set
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin is not set

        # Curl
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_libcurl=y
        CONFIG_LIBCURL_NGHTTP3=y
        CONFIG_LIBCURL_NGTCP2=y
        CONFIG_LIBCURL_OPENSSL=y
        # CONFIG_LIBCURL_GNUTLS is not set
        # CONFIG_LIBCURL_MBEDTLS is not set
        # CONFIG_LIBCURL_NOSSL is not set
        # CONFIG_LIBCURL_WOLFSSL is not set

        # Firewall
        CONFIG_PACKAGE_nat6=y
        CONFIG_PACKAGE_ip6tables-nft=y
        CONFIG_PACKAGE_iptables-mod-conntrack-extra=y
        CONFIG_PACKAGE_iptables-mod-iprange=y
        CONFIG_PACKAGE_iptables-mod-nat-extra=y
        CONFIG_PACKAGE_iptables-mod-socket=y
        CONFIG_PACKAGE_iptables-mod-tproxy=y
        CONFIG_PACKAGE_iptables-nft=y
        CONFIG_PACKAGE_xtables-nft=y
        # CONFIG_PACKAGE_iptables-legacy is not set

        # Natflow
        CONFIG_PACKAGE_natflow=m

        # SFE
        CONFIG_PACKAGE_kmod-fast-classifier=y
        CONFIG_PACKAGE_kmod-shortcut-fe-cm=y

        # Zram
        CONFIG_PACKAGE_zram-swap=y
        CONFIG_ZRAM_DEF_COMP_LZ4=y

        # Busybox
        CONFIG_BUSYBOX_CUSTOM=y
        CONFIG_BUSYBOX_CONFIG_ASH_HELP=y
        CONFIG_BUSYBOX_CONFIG_FEATURE_EDITING_HISTORY=1024
        CONFIG_BUSYBOX_CONFIG_FEATURE_EDITING_SAVEHISTORY=y
        CONFIG_BUSYBOX_CONFIG_FEATURE_PREFER_IPV4_ADDRESS=y
        CONFIG_BUSYBOX_CONFIG_FEATURE_SH_HISTFILESIZE=y
        CONFIG_BUSYBOX_CONFIG_FEATURE_SYSLOG_INFO=y

        # Dnsmasq
        CONFIG_PACKAGE_dnsmasq-full=y
        CONFIG_PACKAGE_dnsmasq_full_ipset=y
        # CONFIG_PACKAGE_dnsmasq_full_broken_rtc is not set
        # CONFIG_PACKAGE_dnsmasq is not set


        # Luci
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-lib-base=y
        CONFIG_PACKAGE_luci-lib-ip=y
        CONFIG_PACKAGE_luci-lib-ipkg=y
        CONFIG_PACKAGE_luci-lib-jsonc=y
        CONFIG_PACKAGE_luci-lib-nixio=y
        CONFIG_PACKAGE_luci-nginx=y
        CONFIG_PACKAGE_luci-proto-wireguard=y
        CONFIG_PACKAGE_luci-theme-argon=y
        CONFIG_PACKAGE_luci-theme-material=y
        CONFIG_PACKAGE_luci-theme-openwrt-2020=y
        CONFIG_LUCI_LANG_zh_Hans=y
        # CONFIG_LUCI_CSSTIDY is not set
        # CONFIG_LUCI_JSMIN is not set

        # Nginx
        CONFIG_PACKAGE_nginx-ssl=y
        CONFIG_PACKAGE_nginx-mod-brotli=y
        CONFIG_PACKAGE_nginx-mod-luci=y
        CONFIG_PACKAGE_nginx-mod-rtmp=y
        CONFIG_PACKAGE_nginx-mod-stream=y
        CONFIG_PACKAGE_nginx-mod-ubus=y
        CONFIG_PACKAGE_nginx-mod-zstd=y
        CONFIG_PACKAGE_nginx-ssl-util=y
        CONFIG_NGINX_DAV=y
        CONFIG_NGINX_HTTP_AUTH_BASIC=y
        CONFIG_NGINX_HTTP_QUIC=y
        CONFIG_NGINX_HTTP_REAL_IP=y
        CONFIG_NGINX_HTTP_SUB=y
        CONFIG_NGINX_STREAM_REAL_IP=y

        # DDNS Scripts
        CONFIG_PACKAGE_ddns-scripts=y
        CONFIG_PACKAGE_ddns-scripts-aliyun=y
        CONFIG_PACKAGE_ddns-scripts-cloudflare=y
        CONFIG_PACKAGE_ddns-scripts-dnspod=y
        CONFIG_PACKAGE_ddns-scripts-freedns=y
        CONFIG_PACKAGE_ddns-scripts-godaddy=y
        CONFIG_PACKAGE_ddns-scripts-services=y


        # OpenSSL
        CONFIG_OPENSSL_ENGINE=y
        CONFIG_OPENSSL_OPTIMIZE_SPEED=y
        CONFIG_OPENSSL_WITH_ASM=y
        CONFIG_PACKAGE_libopenssl-afalg=y
        CONFIG_PACKAGE_libopenssl-conf=y
        CONFIG_PACKAGE_libopenssl-devcrypto=y
        CONFIG_PACKAGE_libopenssl-legacy=y
        CONFIG_PACKAGE_openssl-util=y
        # CONFIG_PACKAGE_libopenssl-padlock is not set
        # CONFIG_OPENSSL_WITH_ERROR_MESSAGES is not set

        # Share Network
        CONFIG_PACKAGE_usbmuxd=y
        CONFIG_PACKAGE_kmod-usb-net-rndis=y
        CONFIG_PACKAGE_kmod-usb-net-ipheth=y

        # Kernel Modules
        CONFIG_PACKAGE_kmod-bonding=y
        CONFIG_PACKAGE_kmod-br-netfilter=y
        CONFIG_PACKAGE_kmod-button-hotplug=y
        CONFIG_PACKAGE_kmod-crypto-chacha20poly1305=y
        CONFIG_PACKAGE_kmod-crypto-sha256=y
        CONFIG_PACKAGE_kmod-fs-exfat=y
        CONFIG_PACKAGE_kmod-fs-f2fs=y
        CONFIG_PACKAGE_kmod-fs-ntfs3=y
        CONFIG_PACKAGE_kmod-fs-vfat=y
        CONFIG_PACKAGE_kmod-fs-xfs=y
        CONFIG_PACKAGE_kmod-hwmon-pwmfan=y
        CONFIG_PACKAGE_kmod-ikconfig=y
        CONFIG_PACKAGE_kmod-inet-diag=y
        CONFIG_PACKAGE_kmod-ipsec4=y
        CONFIG_PACKAGE_kmod-ipsec6=y
        CONFIG_PACKAGE_kmod-ipt-nat6=y
        CONFIG_PACKAGE_kmod-ipt-tproxy=y
        CONFIG_PACKAGE_kmod-iptunnel6=y
        CONFIG_PACKAGE_kmod-mac80211=y
        CONFIG_PACKAGE_kmod-nf-socket=y
        CONFIG_PACKAGE_kmod-nft-fullcone=y
        CONFIG_PACKAGE_kmod-nft-offload=y
        CONFIG_PACKAGE_kmod-nft-socket=y
        CONFIG_PACKAGE_kmod-nft-tproxy=y
        CONFIG_PACKAGE_kmod-nls-cp936=y
        CONFIG_PACKAGE_kmod-nls-cp950=y
        CONFIG_PACKAGE_kmod-sched-bpf=y
        CONFIG_PACKAGE_kmod-sched-cake=y
        CONFIG_PACKAGE_kmod-sched-core=y
        CONFIG_PACKAGE_kmod-sched=y
        CONFIG_PACKAGE_kmod-tcp-bbr3=y
        CONFIG_PACKAGE_kmod-tcp-brutal=y
        CONFIG_PACKAGE_kmod-tls=y
        CONFIG_PACKAGE_kmod-tun=y
        CONFIG_PACKAGE_kmod-usb-audio=y
        CONFIG_PACKAGE_kmod-usb-hid=y
        CONFIG_PACKAGE_kmod-usb-storage-uas=y
        CONFIG_PACKAGE_kmod-usb2-pci=y
        CONFIG_PACKAGE_kmod-usb2=y
        CONFIG_PACKAGE_kmod-usb3=y
        CONFIG_PACKAGE_kmod-veth=y
        CONFIG_PACKAGE_kmod-xdp-sockets-diag=y

        # Kernel Modules - out-of-tree driver
        CONFIG_PACKAGE_kmod-usb-net-rtl8152-vendor=y

        # Kernel Modules - USB WiFi Adapter
        CONFIG_PACKAGE_kmod-mt7921u=y
        # CONFIG_PACKAGE_kmod-rtl8812au-ct is not set

        # Kernel driver
        CONFIG_PACKAGE_kmod-igb=y
        CONFIG_PACKAGE_kmod-igc=y
        CONFIG_PACKAGE_kmod-mlx4-core=y
        CONFIG_PACKAGE_kmod-mlx5-core=y
        CONFIG_PACKAGE_kmod-mt76x2=y
        CONFIG_PACKAGE_kmod-mt7921e=y
        CONFIG_PACKAGE_kmod-mt7921u=y
        CONFIG_PACKAGE_kmod-mt7922-firmware=y
        CONFIG_PACKAGE_kmod-ngbe=y
        CONFIG_PACKAGE_kmod-r8101=y
        CONFIG_PACKAGE_kmod-r8125=y
        CONFIG_PACKAGE_kmod-r8126=y
        CONFIG_PACKAGE_kmod-r8127=y
        CONFIG_PACKAGE_kmod-r8168=y
        CONFIG_PACKAGE_kmod-txgbe=y
        # CONFIG_PACKAGE_kmod-r8169 is not set
        CONFIG_PACKAGE_kmod-nvme=y

        # Display & Extra Drivers
        CONFIG_PACKAGE_i915-firmware-huc=y
        CONFIG_PACKAGE_kmod-drm-i915=y
        CONFIG_PACKAGE_kmod-sound-hda-codec-realtek=y
        CONFIG_PACKAGE_kmod-sound-hda-intel=y

        # Utilities
        CONFIG_PACKAGE_bash=y
        CONFIG_PACKAGE_bash-completion=y
        CONFIG_PACKAGE_dmesg=y
        CONFIG_PACKAGE_dosfstools=y
        CONFIG_PACKAGE_exfat-fsck=y
        CONFIG_PACKAGE_exfat-mkfs=y
        CONFIG_PACKAGE_f2fs-tools=y
        CONFIG_PACKAGE_fdisk=y
        CONFIG_PACKAGE_file=y
        CONFIG_PACKAGE_fstrim=y
        CONFIG_PACKAGE_ftp=y
        CONFIG_PACKAGE_gdisk=y
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_iperf3=y
        CONFIG_PACKAGE_iputils-ping=y
        CONFIG_PACKAGE_lrzsz=y
        CONFIG_PACKAGE_lsblk=y
        CONFIG_PACKAGE_lscpu=y
        CONFIG_PACKAGE_lsof=y
        CONFIG_PACKAGE_openssh-sftp-server=y
        CONFIG_PACKAGE_pciutils=y
        CONFIG_PACKAGE_qrencode=y
        CONFIG_PACKAGE_rename=y
        CONFIG_PACKAGE_resize2fs=y
        CONFIG_PACKAGE_rsync=y
        CONFIG_PACKAGE_screen=y
        CONFIG_PACKAGE_sed=y
        CONFIG_PACKAGE_sshpass=y
        CONFIG_PACKAGE_tar=y
        CONFIG_PACKAGE_taskset=y
        CONFIG_PACKAGE_telnet-bsd=y
        CONFIG_PACKAGE_tree=y
        CONFIG_PACKAGE_unzip=y
        CONFIG_PACKAGE_usbutils=y
        CONFIG_PACKAGE_vim=y
        CONFIG_PACKAGE_wget-ssl=y
        CONFIG_PACKAGE_wpad-openssl=y
        CONFIG_PACKAGE_xfs-admin=y
        CONFIG_PACKAGE_xfs-fsck=y
        CONFIG_PACKAGE_xfs-growfs=y
        CONFIG_PACKAGE_xfs-mkfs=y
        CONFIG_PACKAGE_xz-utils=y
        CONFIG_PACKAGE_xz=y
        CONFIG_PACKAGE_zip=y
        CONFIG_PACKAGE_zoneinfo-asia=y

        # GNU Core Utilities
        CONFIG_PACKAGE_coreutils=y
        CONFIG_PACKAGE_coreutils-cat=y
        CONFIG_PACKAGE_coreutils-chmod=y
        CONFIG_PACKAGE_coreutils-chown=y
        CONFIG_PACKAGE_coreutils-chroot=y
        CONFIG_PACKAGE_coreutils-cp=y
        CONFIG_PACKAGE_coreutils-date=y
        CONFIG_PACKAGE_coreutils-dd=y
        CONFIG_PACKAGE_coreutils-dircolors=y
        CONFIG_PACKAGE_coreutils-ls=y
        CONFIG_PACKAGE_coreutils-mkdir=y
        CONFIG_PACKAGE_coreutils-mv=y
        CONFIG_PACKAGE_coreutils-nproc=y
        CONFIG_PACKAGE_coreutils-rm=y
        CONFIG_PACKAGE_coreutils-sha1sum=y
        CONFIG_PACKAGE_coreutils-sha512sum=y
        CONFIG_PACKAGE_coreutils-sleep=y
        CONFIG_PACKAGE_coreutils-timeout=y
        CONFIG_PACKAGE_coreutils-truncate=y

        # procps-ng Utilities
        CONFIG_PACKAGE_procps-ng=y
        CONFIG_PACKAGE_procps-ng-free=y
        CONFIG_PACKAGE_procps-ng-ps=y
        CONFIG_PACKAGE_procps-ng-top=y

        # Version
        CONFIG_IMAGEOPT=y
        CONFIG_VERSIONOPT=y
        CONFIG_VERSION_FILENAMES=y

        # ZLIB
        CONFIG_ZLIB_OPTIMIZE_SPEED=y
        EOF
        make defconfig

    # 编译 OpenWrt
    - name: Build OpenWrt
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
      env:
        CONFIG_CCACHE: 1

    # 上传编译结果到 Artifacts
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-firmware
        path: openwrt/bin/targets/*/*/*
        retention-days: 5

    # 创建 GitHub Release 并上传固件
    - name: Create GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 获取当前时间作为 Release 标签
        TAG_NAME="openwrt-24.10.2-$(date +%Y%m%d-%H%M%S)"
        # 创建 Release
        gh release create "$TAG_NAME" \
          --title "OpenWrt 24.10.2 Build $TAG_NAME" \
          --notes "Custom OpenWrt build with kernel 6.12.42, LAN IP 192.168.2.2, nikki, cloudflared, luci-app-wechatpush, and luci-app-passwall" \
          --draft=false
        # 上传固件到 Release
        gh release upload "$TAG_NAME" openwrt/bin/targets/*/*/* --clobber
      working-directory: openwrt
